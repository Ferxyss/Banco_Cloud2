spring.application.name=cuentas-service
server.port=8081

# Base de datos MySQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Autenticación Cognito
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_I8wmJa8tS

# Kafka - Productor de cuentas
app.kafka.cuentas.enabled=${KAFKA_CUENTAS_ENABLED:false}
app.kafka.cuentas.topic=${KAFKA_CUENTAS_TOPIC:bancocloud.cuentas.habilitadas.v1}
app.kafka.cuentas.poll-interval=2000

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.admin.auto-create=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties[enable.idempotence]=true
spring.kafka.producer.properties[spring.json.add.type.headers]=false
spring.kafka.producer.properties[max.block.ms]=3000
spring.kafka.producer.properties[request.timeout.ms]=5000
spring.kafka.producer.properties[delivery.timeout.ms]=10000