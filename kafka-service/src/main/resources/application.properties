spring.application.name=kafka-service
server.port=${KAFKA_SERVICE_PORT:8083}
server.address=${KAFKA_SERVICE_ADDRESS:127.0.0.1}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=always

spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_I8wmJa8tS}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.admin.auto-create=${KAFKA_CREAR_TOPICOS_DLQ:true}
spring.kafka.admin.fail-fast=true
spring.kafka.admin.properties[request.timeout.ms]=5000
spring.kafka.admin.properties[default.api.timeout.ms]=8000

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=${KAFKA_CONCURRENCIA:1}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties[enable.idempotence]=true
spring.kafka.producer.properties[request.timeout.ms]=5000
spring.kafka.producer.properties[delivery.timeout.ms]=10000

app.kafka.topicos.solicitudes=${KAFKA_SOLICITUDES_TOPIC:bancocloud.solicitudes.creadas.v1}
app.kafka.topicos.cuentas=${KAFKA_CUENTAS_TOPIC:bancocloud.cuentas.habilitadas.v1}
app.kafka.grupos.solicitudes=${KAFKA_GRUPO_SOLICITUDES:bancocloud-analitica-solicitudes-v1}
app.kafka.grupos.cuentas=${KAFKA_GRUPO_CUENTAS:bancocloud-analitica-cuentas-v1}
app.kafka.dlq.particiones=${KAFKA_DLQ_PARTICIONES:3}
app.kafka.dlq.replicas=${KAFKA_DLQ_REPLICAS:3}
app.kafka.dlq.min-isr=${KAFKA_DLQ_MIN_ISR:2}
app.kafka.dlq.retencion-ms=${KAFKA_DLQ_RETENCION_MS:604800000}
