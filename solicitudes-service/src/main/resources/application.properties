spring.application.name=solicitudes-service
server.port=8082

# Base de datos MySQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Confirmaciones de publicación RabbitMQ
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Nombres centralizados de mensajería
app.rabbitmq.exchange=bancocloud.solicitudes.exchange
app.rabbitmq.solicitud-queue=bancocloud.solicitudes.queue
app.rabbitmq.solicitud-routing-key=solicitud.creada
app.rabbitmq.dead-letter-exchange=bancocloud.solicitudes.dlx
app.rabbitmq.dead-letter-queue=bancocloud.solicitudes.dlq
app.rabbitmq.dead-letter-routing-key=solicitud.fallida

# RabbitMQ - Reintentos
app.rabbitmq.retry-exchange=bancocloud.solicitudes.retry.exchange
app.rabbitmq.retry-queue=bancocloud.solicitudes.retry.queue
app.rabbitmq.retry-routing-key=solicitud.reintento
app.rabbitmq.retry-ttl=5000
app.rabbitmq.max-attempts=3

# Autenticación Cognito
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_I8wmJa8tS

# Diagnóstico de autenticación JWT
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.oauth2=INFO

# RabbitMQ - Demostración
app.rabbitmq.demo-exchange=bancocloud.demo.exchange
app.rabbitmq.demo-queue=bancocloud.demo.queue
app.rabbitmq.demo-routing-key=demo.mensaje

# Pruebas locales de reintentos
app.rabbitmq.retry-test.enabled=false

# Confirmación del broker
app.rabbitmq.publisher-confirm-timeout=10000

# RabbitMQ Management API
app.rabbitmq.management.api-url=${RABBITMQ_MANAGEMENT_URL:http://localhost:15672}
app.rabbitmq.management.username=${RABBITMQ_USERNAME}
app.rabbitmq.management.password=${RABBITMQ_PASSWORD}

# Kafka - Productor de solicitudes
app.kafka.solicitudes.enabled=${KAFKA_SOLICITUDES_ENABLED:false}
app.kafka.solicitudes.topic=${KAFKA_SOLICITUDES_TOPIC:bancocloud.solicitudes.creadas.v1}
app.kafka.solicitudes.poll-interval=2000

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.admin.auto-create=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties[enable.idempotence]=true
spring.kafka.producer.properties[spring.json.add.type.headers]=false
spring.kafka.producer.properties[max.block.ms]=3000
spring.kafka.producer.properties[request.timeout.ms]=5000
spring.kafka.producer.properties[delivery.timeout.ms]=10000